plugins {
    id "com.android.application"
}

def validationFile = rootProject.file("../Backend/instance/validation/environment.json")
def validationRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains("validation") }
if (validationRequested && !validationFile.isFile()) {
    throw new GradleException("Prepare the paired backend first: Backend/scripts/validation.py prepare")
}
def validationEnvironment = validationFile.isFile() ? new groovy.json.JsonSlurper().parse(validationFile) : [:]
if (validationRequested && (!validationEnvironment.environment_id ||
        !(validationEnvironment.fingerprint ==~ /[0-9a-f]{64}/) || !validationEnvironment.api_base_url)) {
    throw new GradleException("Invalid paired backend manifest; run validation.py prepare again")
}
def javaString = { value -> groovy.json.JsonOutput.toJson(value ?: "") }

def clickApiBaseUrl = providers.gradleProperty("CLICK_API_BASE_URL")
        .getOrElse("https://click-db.onrender.com")
def kakaoNativeAppKey = providers.gradleProperty("KAKAO_NATIVE_APP_KEY")
        .orElse(providers.environmentVariable("KAKAO_NATIVE_APP_KEY")).getOrElse("").trim()
if (kakaoNativeAppKey && !(kakaoNativeAppKey ==~ /[0-9a-fA-F]{32}/)) {
    throw new GradleException("KAKAO_NATIVE_APP_KEY must be the 32-character native app key")
}

android {
    namespace "com.click"
    compileSdk 34

    defaultConfig {
        buildConfigField "String", "KAKAO_NATIVE_APP_KEY", javaString(kakaoNativeAppKey)
        manifestPlaceholders.kakaoRedirectScheme = "kakao${kakaoNativeAppKey ?: 'unconfigured'}"
        applicationId "com.click"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "CLICK_API_BASE_URL", "\"${clickApiBaseUrl}\""
        buildConfigField "String", "CLICK_VALIDATION_ENVIRONMENT_ID", '""'
        buildConfigField "String", "CLICK_VALIDATION_FINGERPRINT", '""'
    }

    buildTypes {
        validation {
            initWith debug
            applicationIdSuffix ".validation"
            versionNameSuffix "-validation"
            matchingFallbacks = ["debug"]
            signingConfig signingConfigs.debug
            buildConfigField "String", "CLICK_API_BASE_URL", javaString(validationEnvironment.api_base_url)
            buildConfigField "String", "CLICK_VALIDATION_ENVIRONMENT_ID", javaString(validationEnvironment.environment_id)
            buildConfigField "String", "CLICK_VALIDATION_FINGERPRINT", javaString(validationEnvironment.fingerprint)
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    testBuildType(validationRequested ? "validation" : "debug")

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main.assets.srcDir "../../AI-Agent/goal_catalog"
        test.resources.srcDir "../../Backend/docs"
        test.resources.srcDir "../../AI-Agent/goal_catalog"
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation "com.kakao.sdk:v2-user:2.26.0"
    implementation project(":design-preview")
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    // Bundled models make the first fallback deterministic and keep screenshots on-device.
    implementation "com.google.mlkit:text-recognition-korean:16.0.1"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation "org.mockito:mockito-core:5.14.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
}

// Replay the service's serialized requests against the backend in CI.
tasks.withType(Test).configureEach {
    def contractOutput = layout.buildDirectory.dir("contract/${name}")
    systemProperty "click.contractOutput", contractOutput.get().asFile.absolutePath
    outputs.dir(contractOutput)
}

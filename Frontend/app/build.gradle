    doLast {
        def target = new File(generatedLoginGuide.get().asFile, "com/click/generated/Gov24LoginPolicyData.java")
        target.parentFile.mkdirs()
        target.setText("package com.click.generated; public final class Gov24LoginPolicyData { public static String json() { return " +
            groovy.json.JsonOutput.toJson(loginGuidePolicy.getText("UTF-8")) + "; } }", "UTF-8")
    }

plugins {
    id "com.android.application"
}

def clickApiBaseUrl = providers.gradleProperty("CLICK_API_BASE_URL")
        .getOrElse("https://click-db.onrender.com")

android {
    namespace "com.click"
    compileSdk 34

    defaultConfig {
        applicationId "com.click"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "CLICK_API_BASE_URL", "\"${clickApiBaseUrl}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main.assets.srcDir "../../AI-Agent/goal_catalog"
    }
}

dependencies {
    implementation project(":design-preview")
    implementation "com.google.mlkit:text-recognition-korean:16.0.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    // Bundled models make the first fallback deterministic and keep screenshots on-device.
    implementation "com.google.mlkit:text-recognition-korean:16.0.1"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
}

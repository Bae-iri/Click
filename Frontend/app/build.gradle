plugins {
    id "com.android.application"
}

def validationFile = rootProject.file(providers.gradleProperty("CLICK_VALIDATION_MANIFEST")
        .getOrElse("../Backend/instance/validation/environment.json"))
def validationRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains("validation") }
if (validationRequested && !validationFile.isFile()) {
    throw new GradleException("Prepare the paired backend first: Backend/scripts/validation.py prepare")
}
def validationEnvironment = (validationFile.isFile() ?
        new groovy.json.JsonSlurper().parse(validationFile) : [:])
def validationSigningFile = providers.gradleProperty("CLICK_VALIDATION_KEYSTORE").orNull
if (validationRequested && (!validationEnvironment.environment_id ||
        !(validationEnvironment.fingerprint ==~ /[0-9a-f]{64}/) || !validationEnvironment.api_base_url)) {
    throw new GradleException("Invalid paired backend manifest; run validation.py prepare again")
}
def javaString = { value -> groovy.json.JsonOutput.toJson(value ?: "") }

def clickApiBaseUrl = providers.gradleProperty("CLICK_API_BASE_URL")
        .getOrElse("https://click-db.onrender.com")
def clickApplicationId = providers.gradleProperty("CLICK_APPLICATION_ID").getOrElse("com.clueclick.app")
def gov24Pilot = clickApplicationId == "com.click.gov24pilot"
// Keep machine-local Kakao setup across builds without committing an app key.
def localSettings = new Properties()
def localSettingsFile = rootProject.file("local.properties")
if (localSettingsFile.isFile()) localSettingsFile.withInputStream { localSettings.load(it) }
def kakaoNativeAppKey = providers.gradleProperty("KAKAO_NATIVE_APP_KEY")
        .orElse(providers.environmentVariable("KAKAO_NATIVE_APP_KEY"))
        .getOrElse(localSettings.getProperty("KAKAO_NATIVE_APP_KEY", "")).trim()
if (kakaoNativeAppKey && !(kakaoNativeAppKey ==~ /[0-9a-fA-F]{32}/)) {
    throw new GradleException("KAKAO_NATIVE_APP_KEY must be the 32-character native app key")
}

android {
    namespace "com.click"
    compileSdk 34

    defaultConfig {
        buildConfigField "String", "KAKAO_NATIVE_APP_KEY", javaString(kakaoNativeAppKey)
        manifestPlaceholders.kakaoRedirectScheme = "kakao${kakaoNativeAppKey ?: 'unconfigured'}"
        applicationId clickApplicationId
        manifestPlaceholders.clickAppLabel = gov24Pilot ? "클릭 정부24 테스트" : "@string/app_name"
        manifestPlaceholders.clickAccessibilityLabel = gov24Pilot ? "클릭 정부24 테스트" : "@string/accessibility_service_label"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "CLICK_API_BASE_URL", "\"${clickApiBaseUrl}\""
        buildConfigField "String", "CLICK_VALIDATION_ENVIRONMENT_ID", '""'
        buildConfigField "String", "CLICK_VALIDATION_FINGERPRINT", '""'
    }

    signingConfigs {
        validationDevice {
            if (validationSigningFile) storeFile rootProject.file(validationSigningFile)
            storePassword "android"
            keyAlias "AndroidDebugKey"
            keyPassword "android"
        }
    }

    buildTypes {
        validation {
            initWith debug
            // A paired test app must never receive the normal app's Kakao OAuth redirect.
            buildConfigField "String", "KAKAO_NATIVE_APP_KEY", '\"\"'
            manifestPlaceholders.kakaoRedirectScheme = "kakaounconfiguredvalidation"
            applicationIdSuffix providers.gradleProperty("CLICK_VALIDATION_APPLICATION_SUFFIX").getOrElse(".validation")
            versionNameSuffix "-validation"
            resValue "string", "app_name", "Click 실기기 검증"
            matchingFallbacks = ["debug"]
            signingConfig validationSigningFile ? signingConfigs.validationDevice : signingConfigs.debug
            buildConfigField "String", "CLICK_API_BASE_URL", javaString(validationEnvironment.api_base_url)
            buildConfigField "String", "CLICK_VALIDATION_ENVIRONMENT_ID", javaString(validationEnvironment.environment_id)
            buildConfigField "String", "CLICK_VALIDATION_FINGERPRINT", javaString(validationEnvironment.fingerprint)
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    testBuildType(validationRequested ? "validation" : "debug")

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main.assets.srcDir "../../AI-Agent/goal_catalog"
        test.resources.srcDir "../../Backend/docs"
        test.resources.srcDir "../../AI-Agent/goal_catalog"
        test.resources.srcDir "../../AI-Agent/tests/fixtures"
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
    lint {
        // CI checks the advertised minSdk without silencing other lint checks in normal runs.
        if (providers.gradleProperty("CLICK_API_COMPATIBILITY_ONLY").getOrElse("false").toBoolean()) {
            checkOnly "NewApi"
        }
    }
}

dependencies {
    implementation "com.kakao.sdk:v2-user:2.26.0"
    implementation project(":design-preview")
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    // Bundled models make the first fallback deterministic and keep screenshots on-device.
    implementation "com.google.mlkit:text-recognition-korean:16.0.1"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation "org.mockito:mockito-core:5.14.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
}

// Replay the service's serialized requests against the backend in CI.
tasks.withType(Test).configureEach {
    maxHeapSize = "1536m"
    forkEvery = 10
    def contractOutput = layout.buildDirectory.dir("contract/${name}")
    systemProperty "click.contractOutput", contractOutput.get().asFile.absolutePath
    outputs.dir(contractOutput)
}

// One reviewed JSON is consumed by Python, Android assets and native policy code.
def settingsCapabilities = rootProject.file("../AI-Agent/goal_catalog/settings_capabilities.json")
def generatedCapabilities = layout.buildDirectory.dir("generated/settingsCapabilities/java")
def generateSettingsCapabilities = tasks.register("generateSettingsCapabilities") {
    inputs.file(settingsCapabilities)
    outputs.dir(generatedCapabilities)
    doLast {
        def json = settingsCapabilities.getText("UTF-8")
        def parsed = new groovy.json.JsonSlurper().parseText(json)
        if (parsed.schema_version != "settings-capabilities.v1") throw new GradleException("Unsupported settings capability contract")
        def target = new File(generatedCapabilities.get().asFile, "com/click/generated/SettingsCapabilitiesData.java")
        target.parentFile.mkdirs()
        def body = new StringBuilder("package com.click.generated;\npublic final class SettingsCapabilitiesData {\npublic static String json() { StringBuilder value=new StringBuilder();\n")
        for (int i=0;i<json.length();i+=2048) body.append("value.append(").append(groovy.json.JsonOutput.toJson(json.substring(i, Math.min(i+2048,json.length())))).append(");\n")
        body.append("return value.toString(); }\n}\n")
        target.setText(body.toString(), "UTF-8")
    }
}
android.sourceSets.main.java.srcDir(generatedCapabilities)
tasks.named("preBuild").configure { dependsOn(generateSettingsCapabilities) }


// Graph-independent foreground environment and cause-specific recovery policy.
def environmentPolicy = rootProject.file("../AI-Agent/goal_catalog/screen_environment_policy.json")
def generatedEnvironment = layout.buildDirectory.dir("generated/screenEnvironment/java")
def generateScreenEnvironment = tasks.register("generateScreenEnvironment") {
    inputs.file(environmentPolicy)
    outputs.dir(generatedEnvironment)
    doLast {
        def json=environmentPolicy.getText("UTF-8")
        if(new groovy.json.JsonSlurper().parseText(json).schema_version!="screen-environment.v1") throw new GradleException("Unsupported environment policy")
        def target=new File(generatedEnvironment.get().asFile,"com/click/generated/ScreenEnvironmentData.java")
        target.parentFile.mkdirs()
        def body=new StringBuilder("package com.click.generated;\npublic final class ScreenEnvironmentData { public static String json(){ StringBuilder value=new StringBuilder();\n")
        for(int i=0;i<json.length();i+=2048) body.append("value.append(").append(groovy.json.JsonOutput.toJson(json.substring(i,Math.min(i+2048,json.length())))).append(");\n")
        body.append("return value.toString();}}\n")
        target.setText(body.toString(),"UTF-8")
    }
}
android.sourceSets.main.java.srcDir(generatedEnvironment)
tasks.named("preBuild").configure { dependsOn(generateScreenEnvironment) }

// The lifecycle projection is generated from the exact policy used by Python.
def executionPolicy = rootProject.file("../AI-Agent/goal_catalog/execution_state_contract.json")
def generatedExecution = layout.buildDirectory.dir("generated/executionState/java")
def generateExecutionState = tasks.register("generateExecutionState") {
    inputs.file(executionPolicy)
    outputs.dir(generatedExecution)
    doLast {
        def target = new File(generatedExecution.get().asFile, "com/click/generated/ExecutionStateData.java")
        target.parentFile.mkdirs()
        target.setText("package com.click.generated;\npublic final class ExecutionStateData { public static String json() { return " +
                groovy.json.JsonOutput.toJson(executionPolicy.getText("UTF-8")) + "; } }\n", "UTF-8")
    }
}
android.sourceSets.main.java.srcDir(generatedExecution)
tasks.named("preBuild").configure { dependsOn(generateExecutionState) }


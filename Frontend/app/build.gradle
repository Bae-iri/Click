// Bind an APK to the exact API origin used in its BuildConfig before installation.
android.buildTypes.each { kind ->
    def title = kind.name.capitalize()
    def identityAssets = layout.buildDirectory.dir("generated/releaseIdentity/${kind.name}/assets")
    def apiOrigin = kind.name == "validation" ? (validationEnvironment.api_base_url ?: clickApiBaseUrl) : clickApiBaseUrl
    def generateIdentity = tasks.register("generate${title}ReleaseIdentity") {
        inputs.property("apiBaseUrl", apiOrigin)
        inputs.property("taskTerminationVersion", "task-termination.v1")
        outputs.dir(identityAssets)
        doLast {
            def output = new File(identityAssets.get().asFile, "click_release_identity.json")
            output.parentFile.mkdirs()
            output.setText(groovy.json.JsonOutput.toJson([api_base_url: apiOrigin, task_termination_version: "task-termination.v1"]), "UTF-8")
        }
    }
    android.sourceSets.getByName(kind.name).assets.srcDir(identityAssets)
    tasks.matching {
        it.name == "merge${title}Assets" || it.name.contains(title)
                && (it.name.contains("Lint") || it.name.startsWith("lint"))
    }.configureEach { dependsOn(generateIdentity) }
}


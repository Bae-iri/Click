# Web service only. Reuse the existing click_db (Singapore, PostgreSQL 18).
# Supply its Internal Database URL as DATABASE_URL. No database is created here.
services:
  - type: web
    name: click-dev-api
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    branch: develop
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: .
    dockerCommand: python scripts/render_start.py
    preDeployCommand: python scripts/render_start.py --migrate
    healthCheckPath: /ready
    numInstances: 1
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        value: ""

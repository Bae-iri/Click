# Web service only. Reuse the existing click_db (Singapore, PostgreSQL 18).
# Supply its Internal Database URL as DATABASE_URL. No database is created here.
services:
  - type: web
    name: click-dev-api
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    branch: develop
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: .
    dockerCommand: python scripts/render_start.py
    preDeployCommand: python scripts/render_start.py --migrate
    healthCheckPath: /ready
    numInstances: 1
    autoDeployTrigger: checksPass
    envVars:
      - key: CLICK_REQUIRE_EXECUTION_CONTEXT
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: DATA_ENCRYPTION_KEYS
        sync: false
      - key: DATA_LOOKUP_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI1_UI_SELECTOR_PROVIDER
        value: jev
      - key: GOAL_CLASSIFIER_PROVIDER
        value: jev
      - key: CLICK_COUPANG_BROWSE_ENABLED
        value: "1"
      - key: CLICK_GOV24_GUIDE_ENABLED
        value: "1"
      - key: CLICK_AI2_BROWSE_GRAPH_ENABLED
        value: "1"
      - key: CLICK_AI2_BROWSE_GRAPH_INTERVAL_SECONDS
        value: "60"
      - key: TYPESAFE_API_KEY
        sync: false
      - key: JEV_MODEL
        value: jev-1.14.0
      - key: JEV_MIN_CONFIDENCE
        value: "0.8"
      - key: JEV_SCREEN_JUDGMENT_MODE
        value: atomic
      - key: JEV_CHOICE_TEMPERATURE
        value: "0.7"

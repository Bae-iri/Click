name: Backend verification
on:
  push:
    paths: ["Backend/**", "AI-Agent/**", "Frontend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["Backend/**", "AI-Agent/**", "Frontend/**", ".github/workflows/backend.yml"]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew :app:testDebugUnitTest :app:assembleDebug
        working-directory: Frontend
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: click_test
          POSTGRES_USER: click_test
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U click_test -d click_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e './Backend[test]'
      - run: python -m pytest -q
        working-directory: Backend
      - run: python -m pytest -q
        working-directory: AI-Agent
      - run: python scripts/smoke_check.py
        working-directory: Backend
      - run: python scripts/load_check.py
        working-directory: Backend
      - run: python scripts/postgres_check.py
        working-directory: Backend
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://click_test:test-only-password@localhost:5432/click_test
      - run: python scripts/export_openapi.py && git diff --exit-code docs/openapi.json
        working-directory: Backend

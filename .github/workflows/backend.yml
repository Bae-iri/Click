name: Integration verification
on:
  push:
    paths: ["Backend/**", "AI-Agent/**", "Frontend/**", "render.yaml", ".dockerignore", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["Backend/**", "AI-Agent/**", "Frontend/**", "render.yaml", ".dockerignore", ".github/workflows/backend.yml"]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Download Gradle with retries
        run: bash scripts/prepare-gradle-ci.sh
        working-directory: Frontend
      - run: bash gradlew :app:testDebugUnitTest :app:assembleDebug
        working-directory: Frontend
  backend:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        postgres: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: click_test
          POSTGRES_USER: click_test
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U click_test -d click_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"
      - run: python -m pip install -c Backend/constraints-ci.txt setuptools
      - run: python -m pip install --no-build-isolation -c Backend/constraints-ci.txt -e './Backend[test]'
      - run: python -m pip check
      - run: python -m pytest -q
        working-directory: Backend
      - run: python -m pytest -q
        working-directory: AI-Agent
      - name: Check shared settings execution contract
        run: PYTHONPATH=.:../AI-Agent/src python scripts/export_settings_capabilities.py --check
        working-directory: Backend
      - run: python scripts/smoke_check.py
        working-directory: Backend
      - run: python scripts/load_check.py
        working-directory: Backend
      - run: python scripts/postgres_check.py
        working-directory: Backend
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://click_test:test-only-password@localhost:5432/click_test
      - run: python scripts/export_openapi.py && git diff --exit-code docs/openapi.json
        working-directory: Backend
  android-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17.0.18+8"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Download Gradle with retries
        run: bash scripts/prepare-gradle-ci.sh
        working-directory: Frontend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"
      - run: python -m pip install -c Backend/constraints-ci.txt setuptools
      - run: python -m pip install --no-build-isolation -c Backend/constraints-ci.txt -e './Backend[test]'
      - run: python -m pip check
      - name: Export current backend contract for Android capability negotiation
        run: python scripts/export_openapi.py && git diff --exit-code docs/openapi.json
        working-directory: Backend
      - name: Android unit tests, service regression tests and APK builds
        run: bash gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console=plain
        working-directory: Frontend
      - name: Replay Android service requests at the authenticated backend API
        run: python -m pytest -q contract_tests
        working-directory: Backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-contract-verification
          path: |
            Frontend/app/build/reports/tests/
            Frontend/app/build/test-results/
            Frontend/app/build/contract/

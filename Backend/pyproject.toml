[project]
name = "click-backend"
version = "0.1.0"
description = "Backend API for the Click Android overlay guide"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.9,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "cryptography>=50.0.2,<51",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9.0",
    "numpy>=1.26,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["click*"]

[tool.setuptools.package-data]
"app.task_graphs" = ["*.json", "artifacts/*.json"]

[tool.pytest.ini_options]
pythonpath = [".", "../AI-Agent/src"]
testpaths = ["tests"]
markers = ["process_runtime: exercise spawned production workers instead of controlled in-process providers"]

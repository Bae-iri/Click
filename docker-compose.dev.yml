services:
  migrate:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://click:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/click
      DATA_ENCRYPTION_KEYS: ${DATA_ENCRYPTION_KEYS:?Set DATA_ENCRYPTION_KEYS in .env}
      DATA_LOOKUP_KEY: ${DATA_LOOKUP_KEY:?Set DATA_LOOKUP_KEY in .env}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://click:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/click
      DATA_ENCRYPTION_KEYS: ${DATA_ENCRYPTION_KEYS:?Set DATA_ENCRYPTION_KEYS in .env}
      DATA_LOOKUP_KEY: ${DATA_LOOKUP_KEY:?Set DATA_LOOKUP_KEY in .env}
      GEMINI_API_KEY: ""
      APP_TASK_PROVIDER: ${APP_TASK_PROVIDER:-gemini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      APP_TASK_OPENAI_MODEL: ${APP_TASK_OPENAI_MODEL:-gpt-6.2-sol}
      AI1_UI_SELECTOR_PROVIDER: ${AI1_UI_SELECTOR_PROVIDER:-rules}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      JEV_MODEL: ${JEV_MODEL:-jev-1.14.0}
      JEV_MIN_CONFIDENCE: ${JEV_MIN_CONFIDENCE:-0.8}
      JEV_SCREEN_JUDGMENT_MODE: ${JEV_SCREEN_JUDGMENT_MODE:-atomic}
      JEV_CHOICE_TEMPERATURE: ${JEV_CHOICE_TEMPERATURE:-0.7}
      GOAL_CLASSIFIER_PROVIDER: ${GOAL_CLASSIFIER_PROVIDER:-self_hosted}
      CLICK_COUPANG_BROWSE_ENABLED: ${CLICK_COUPANG_BROWSE_ENABLED:-1}
      KAKAO_APP_ID: ${KAKAO_APP_ID:-}
      GUIDE_NARRATION_ENABLED: ${GUIDE_NARRATION_ENABLED:-false}
      SELF_HOSTED_LLM_URL: ${SELF_HOSTED_LLM_URL:-}
      SELF_HOSTED_LLM_TOKEN: ${SELF_HOSTED_LLM_TOKEN:-}
      SELF_HOSTED_LLM_MODEL: ${SELF_HOSTED_LLM_MODEL:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

services:
  migrate:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://click:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/click
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://click:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/click
      GEMINI_API_KEY: ""
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

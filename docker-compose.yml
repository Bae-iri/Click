services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: click
      POSTGRES_USER: click
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-password}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U click -d click"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - click_postgres:/var/lib/postgresql/data

volumes:
  click_postgres:
